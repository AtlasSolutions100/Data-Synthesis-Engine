    Job:
      type: object
      required: [id, jobNumber, name, status, contractAmountCents, incomeCents, costCents, profitCents, remainingCents, billedToDateCents, remainingContractCents, overUnderBillingCents]
      properties:
        id:
          type: integer
        jobNumber:
          type: string
        name:
          type: string
        poNumber:
          type: ["string", "null"]
          description: Customer purchase order number for this job
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, on_hold, inactive]
        inactiveNote:
          type: ["string", "null"]
          description: Why the job was made inactive; kept after reactivation
        contractAmountCents:
          type: integer
          description: Contract value in integer cents
        incomeCents:
          type: integer
          description: Billed income in cents (computed from line items)
        costCents:
          type: integer
          description: Total cost in cents (computed from line items)
        profitCents:
          type: integer
          description: incomeCents minus costCents
        remainingCents:
          type: integer
          description: contractAmountCents minus costCents (contract budget remaining)
        billedToDateCents:
          type: integer
          description: Sum of invoice line items billed against this job, in cents
        remainingContractCents:
          type: integer
          description: contractAmountCents minus billedToDateCents (left to bill)
        overUnderBillingCents:
          type: integer
          description: billedToDateCents minus costCents (positive = overbilled, negative = underbilled)
        invoiceCount:
          type: integer
          description: Number of invoices billed against this job
        lastInvoicedDate:
          type: ["string", "null"]
          description: Date of the most recent invoice for this job (YYYY-MM-DD)
