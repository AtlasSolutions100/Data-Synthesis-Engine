openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: accounts
    description: Chart of accounts
  - name: customers
    description: Customers
  - name: vendors
    description: Vendors
  - name: employees
    description: Employees
  - name: jobs
    description: Jobs
  - name: transactions
    description: Ledger transactions
  - name: reports
    description: Reporting and dashboards
  - name: invoices
    description: Customer invoices (accounts receivable)
  - name: bills
    description: Vendor bills (accounts payable)
  - name: payroll
    description: Payroll runs and labor costing
  - name: documents
    description: Per-job document management
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List chart of accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get an account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerListItem"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/Error"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error"
  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/Error"
  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of jobs with rolled-up totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Error"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
  /jobs/{id}/cost-summary:
    get:
      operationId: getJobCostSummary
      tags: [jobs]
      summary: Per-job cost summary
      description: Income, cost, profit and per-account breakdown for one job, computed from stored line items.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Job cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCostSummary"
        "404":
          $ref: "#/components/responses/Error"
  /jobs/{id}/documents:
    get:
      operationId: listJobDocuments
      tags: [documents]
      summary: List documents attached to a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: List of job documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobDocument"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createJobDocument
      tags: [documents]
      summary: Attach an uploaded document to a job
      description: Stores metadata for a file already uploaded to object storage.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDocument"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /documents/{id}:
    delete:
      operationId: deleteJobDocument
      tags: [documents]
      summary: Delete a job document
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions
      parameters:
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
        - name: vendorId
          in: query
          required: false
          schema:
            type: integer
        - name: type
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /reports/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [reports]
      summary: Company-wide profit and loss summary
      parameters:
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /reports/cost-by-account:
    get:
      operationId: getCostByAccount
      tags: [reports]
      summary: Totals grouped by account
      parameters:
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: Account totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountTotal"
  /reports/ar-aging:
    get:
      operationId: getArAging
      tags: [reports]
      summary: Accounts receivable aging
      description: Outstanding customer invoice balances grouped by customer and age bucket, as of an optional date (defaults to today).
      parameters:
        - $ref: "#/components/parameters/AsOfDateParam"
      responses:
        "200":
          description: AR aging report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArAging"
  /reports/ap-aging:
    get:
      operationId: getApAging
      tags: [reports]
      summary: Accounts payable aging
      description: Outstanding vendor bill balances grouped by vendor and age bucket, as of an optional date (defaults to today).
      parameters:
        - $ref: "#/components/parameters/AsOfDateParam"
      responses:
        "200":
          description: AP aging report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApAging"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices with computed totals
      parameters:
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, partial, paid]
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a progress invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Error"
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice with lines and payments
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice (replaces line items)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
  /invoices/{id}/payments:
    post:
      operationId: createInvoicePayment
      tags: [invoices]
      summary: Record a customer payment against an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaymentInput"
      responses:
        "201":
          description: Updated invoice with the new payment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /invoices/{invoiceId}/payments/{paymentId}:
    delete:
      operationId: deleteInvoicePayment
      tags: [invoices]
      summary: Remove a recorded customer payment
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List vendor bills with computed totals
      parameters:
        - name: vendorId
          in: query
          required: false
          schema:
            type: integer
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, partial, paid]
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
    post:
      operationId: createBill
      tags: [bills]
      summary: Enter a vendor bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          $ref: "#/components/responses/Error"
  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get a bill with lines, payments and credits
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateBill
      tags: [bills]
      summary: Update a bill (replaces line items)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Delete a bill
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
  /bills/{id}/payments:
    post:
      operationId: createBillPayment
      tags: [bills]
      summary: Pay a vendor bill (check or credit card)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPaymentInput"
      responses:
        "201":
          description: Updated bill with the new payment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /bills/{id}/credits:
    post:
      operationId: createVendorCredit
      tags: [bills]
      summary: Apply a vendor credit against a bill
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorCreditInput"
      responses:
        "201":
          description: Updated bill with the credit applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /reports/payroll-by-job:
    get:
      operationId: getPayrollByJob
      tags: [reports]
      summary: Payroll cost summary by job
      description: Burdened labor allocated to each job across posted payroll runs, reconciling to ledger payroll entries.
      parameters:
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: Payroll by job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollByJob"

  /payroll-runs:
    get:
      operationId: listPayrollRuns
      tags: [payroll]
      summary: List payroll runs with computed totals
      parameters:
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: List of payroll runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollRun"
    post:
      operationId: createPayrollRun
      tags: [payroll]
      summary: Create a payroll run for a pay period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollRunInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/Error"
  /payroll-runs/{id}:
    get:
      operationId: getPayrollRun
      tags: [payroll]
      summary: Get a payroll run with lines and allocations
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePayrollRun
      tags: [payroll]
      summary: Update a draft payroll run (replaces lines and allocations)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollRunUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePayrollRun
      tags: [payroll]
      summary: Delete a payroll run (removes its ledger entries)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
  /payroll-runs/{id}/post:
    post:
      operationId: postPayrollRun
      tags: [payroll]
      summary: Post a payroll run to the ledger
      description: Creates burdened labor cost entries in the ledger, allocated to jobs.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Posted payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /payroll-runs/{id}/unpost:
    post:
      operationId: unpostPayrollRun
      tags: [payroll]
      summary: Reverse a posted payroll run
      description: Removes the run's ledger entries and returns it to draft.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Unposted payroll run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /payroll/extract-hours:
    post:
      operationId: extractPayrollHours
      tags: [payroll]
      summary: Extract structured worker hours from free-form text
      description: Uses an AI model to parse pasted email text or an uploaded timesheet into structured worker-hour rows for review before merging into a draft payroll run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractPayrollHoursInput"
      responses:
        "200":
          description: Extracted worker-hour rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractPayrollHoursResult"
        "400":
          $ref: "#/components/responses/Error"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the currently signed-in user (with role)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (owner only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Error"
  /users/{id}:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Update a user's role (owner only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Remove a user (owner only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    StartDateParam:
      name: startDate
      in: query
      required: false
      description: Inclusive start of the date range (YYYY-MM-DD). Omit for no lower bound.
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    EndDateParam:
      name: endDate
      in: query
      required: false
      description: Inclusive end of the date range (YYYY-MM-DD). Omit for no upper bound.
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    AsOfDateParam:
      name: asOf
      in: query
      required: false
      description: Report balances as of this date (YYYY-MM-DD). Omit for today.
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Account:
      type: object
      required: [id, number, name, type]
      properties:
        id:
          type: integer
        number:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [income, cogs, expense, other_income, other_expense, asset, bank, liability, credit_card]
        parentNumber:
          type: ["string", "null"]
    AccountInput:
      type: object
      required: [number, name, type]
      properties:
        number:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [income, cogs, expense, other_income, other_expense, asset, bank, liability, credit_card]
        parentNumber:
          type: ["string", "null"]
    AccountUpdate:
      type: object
      properties:
        number:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [income, cogs, expense, other_income, other_expense, asset, bank, liability, credit_card]
        parentNumber:
          type: ["string", "null"]

    User:
      type: object
      required: [id, clerkUserId, role]
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, bookkeeper]
    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, bookkeeper]

    Customer:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    CustomerListItem:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [jobCount]
          properties:
            jobCount:
              type: integer
    CustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Vendor:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    VendorInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    VendorUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Employee:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        straightTimeRateCents:
          type: ["integer", "null"]
          description: Hourly straight-time pay rate in integer cents
        overtimeRateCents:
          type: ["integer", "null"]
          description: Hourly overtime pay rate in integer cents
        taxExempt:
          type: boolean
          description: When true, employer payroll taxes are not applied to this worker
        active:
          type: boolean
    EmployeeInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        straightTimeRateCents:
          type: ["integer", "null"]
        overtimeRateCents:
          type: ["integer", "null"]
        taxExempt:
          type: boolean
        active:
          type: boolean
    EmployeeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        straightTimeRateCents:
          type: ["integer", "null"]
        overtimeRateCents:
          type: ["integer", "null"]
        taxExempt:
          type: boolean
        active:
          type: boolean

    Job:
      type: object
      required: [id, jobNumber, name, status, contractAmountCents, incomeCents, costCents, profitCents, remainingCents, billedToDateCents, remainingContractCents, overUnderBillingCents]
      properties:
        id:
          type: integer
        jobNumber:
          type: string
        name:
          type: string
        poNumber:
          type: ["string", "null"]
          description: Customer purchase order number for this job
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, on_hold]
        contractAmountCents:
          type: integer
          description: Contract value in integer cents
        incomeCents:
          type: integer
          description: Billed income in cents (computed from line items)
        costCents:
          type: integer
          description: Total cost in cents (computed from line items)
        profitCents:
          type: integer
          description: incomeCents minus costCents
        remainingCents:
          type: integer
          description: contractAmountCents minus costCents (contract budget remaining)
        billedToDateCents:
          type: integer
          description: Sum of invoice line items billed against this job, in cents
        remainingContractCents:
          type: integer
          description: contractAmountCents minus billedToDateCents (left to bill)
        overUnderBillingCents:
          type: integer
          description: billedToDateCents minus costCents (positive = overbilled, negative = underbilled)
    JobInput:
      type: object
      required: [jobNumber, name]
      properties:
        jobNumber:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        poNumber:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, on_hold]
        contractAmountCents:
          type: integer
    JobUpdate:
      type: object
      properties:
        jobNumber:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        poNumber:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, on_hold]
        contractAmountCents:
          type: integer

    Transaction:
      type: object
      required: [id, date, type, amountCents, accountId]
      properties:
        id:
          type: integer
        date:
          type: string
          description: ISO date (YYYY-MM-DD)
        type:
          type: string
          enum: [invoice, bill, expense, check, payment, journal, vendor_credit, credit_card, payroll]
        num:
          type: ["string", "null"]
        partyName:
          type: ["string", "null"]
          description: Customer or vendor name as displayed
        description:
          type: ["string", "null"]
        accountId:
          type: integer
        accountNumber:
          type: ["string", "null"]
        accountName:
          type: ["string", "null"]
        splitAccountId:
          type: ["integer", "null"]
          description: Offsetting account id (FK to accounts)
        splitAccount:
          type: ["string", "null"]
          description: Offsetting account display name (resolved from splitAccountId when set, otherwise legacy free text)
        jobId:
          type: ["integer", "null"]
        jobNumber:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        vendorId:
          type: ["integer", "null"]
        amountCents:
          type: integer
          description: Signed amount in integer cents
    TransactionInput:
      type: object
      required: [date, type, accountId, amountCents]
      properties:
        date:
          type: string
          minLength: 1
        type:
          type: string
          enum: [invoice, bill, expense, check, payment, journal, vendor_credit, credit_card, payroll]
        num:
          type: ["string", "null"]
        partyName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        accountId:
          type: integer
        splitAccountId:
          type: ["integer", "null"]
        splitAccount:
          type: ["string", "null"]
          description: Legacy free-text split account name; only used when splitAccountId is null
        jobId:
          type: ["integer", "null"]
        customerId:
          type: ["integer", "null"]
        vendorId:
          type: ["integer", "null"]
        amountCents:
          type: integer
    TransactionUpdate:
      type: object
      properties:
        date:
          type: string
          minLength: 1
        type:
          type: string
          enum: [invoice, bill, expense, check, payment, journal, vendor_credit, credit_card, payroll]
        num:
          type: ["string", "null"]
        partyName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        accountId:
          type: integer
        splitAccountId:
          type: ["integer", "null"]
        splitAccount:
          type: ["string", "null"]
          description: Legacy free-text split account name; only used when splitAccountId is null
        jobId:
          type: ["integer", "null"]
        customerId:
          type: ["integer", "null"]
        vendorId:
          type: ["integer", "null"]
        amountCents:
          type: integer

    JobCostSummary:
      type: object
      required: [jobId, jobNumber, name, contractAmountCents, incomeCents, costCents, profitCents, lines]
      properties:
        jobId:
          type: integer
        jobNumber:
          type: string
        name:
          type: string
        customerName:
          type: ["string", "null"]
        contractAmountCents:
          type: integer
        incomeCents:
          type: integer
        costCents:
          type: integer
        profitCents:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/AccountTotal"

    AccountTotal:
      type: object
      required: [accountId, accountNumber, accountName, type, amountCents]
      properties:
        accountId:
          type: integer
        accountNumber:
          type: string
        accountName:
          type: string
        type:
          type: string
          enum: [income, cogs, expense, other_income, other_expense, asset, bank, liability, credit_card]
        amountCents:
          type: integer

    DashboardSummary:
      type: object
      required:
        - totalIncomeCents
        - totalCogsCents
        - grossProfitCents
        - totalExpensesCents
        - netIncomeCents
        - jobCount
        - openJobCount
        - transactionCount
      properties:
        totalIncomeCents:
          type: integer
        totalCogsCents:
          type: integer
        grossProfitCents:
          type: integer
        totalExpensesCents:
          type: integer
        netIncomeCents:
          type: integer
        jobCount:
          type: integer
        openJobCount:
          type: integer
        transactionCount:
          type: integer
        topJobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"

    InvoiceLine:
      type: object
      required: [id, amountCents]
      properties:
        id:
          type: integer
        description:
          type: ["string", "null"]
        amountCents:
          type: integer
    InvoiceLineInput:
      type: object
      required: [amountCents]
      properties:
        description:
          type: ["string", "null"]
        amountCents:
          type: integer
    InvoicePayment:
      type: object
      required: [id, date, method, amountCents]
      properties:
        id:
          type: integer
        date:
          type: string
        method:
          type: string
          enum: [check, cash, ach, credit_card, other]
        referenceNum:
          type: ["string", "null"]
        amountCents:
          type: integer
        memo:
          type: ["string", "null"]
    InvoicePaymentInput:
      type: object
      required: [date, amountCents]
      properties:
        date:
          type: string
          minLength: 1
        method:
          type: string
          enum: [check, cash, ach, credit_card, other]
        referenceNum:
          type: ["string", "null"]
        amountCents:
          type: integer
        memo:
          type: ["string", "null"]
    Invoice:
      type: object
      required: [id, invoiceNumber, jobId, customerId, date, totalCents, paidCents, balanceCents, status, lines]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        jobId:
          type: integer
        jobNumber:
          type: ["string", "null"]
        customerId:
          type: integer
        customerName:
          type: ["string", "null"]
        date:
          type: string
        dueDate:
          type: ["string", "null"]
        memo:
          type: ["string", "null"]
        totalCents:
          type: integer
          description: Sum of line items in cents
        paidCents:
          type: integer
          description: Sum of recorded payments in cents
        balanceCents:
          type: integer
          description: totalCents minus paidCents
        status:
          type: string
          enum: [open, partial, paid]
        contractAmountCents:
          type: ["integer", "null"]
          description: Contract value of the job this invoice bills against
        billedToDateCents:
          type: ["integer", "null"]
          description: Total billed against the job across all invoices, in cents
        remainingContractCents:
          type: ["integer", "null"]
          description: contractAmountCents minus billedToDateCents
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/InvoicePayment"
    InvoiceInput:
      type: object
      required: [invoiceNumber, jobId, date, lines]
      properties:
        invoiceNumber:
          type: string
          minLength: 1
        jobId:
          type: integer
        customerId:
          type: ["integer", "null"]
          description: Defaults to the job's customer when omitted
        date:
          type: string
          minLength: 1
        dueDate:
          type: ["string", "null"]
        memo:
          type: ["string", "null"]
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLineInput"
    InvoiceUpdate:
      type: object
      properties:
        invoiceNumber:
          type: string
          minLength: 1
        date:
          type: string
          minLength: 1
        dueDate:
          type: ["string", "null"]
        memo:
          type: ["string", "null"]
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLineInput"

    BillLine:
      type: object
      required: [id, amountCents]
      properties:
        id:
          type: integer
        accountId:
          type: ["integer", "null"]
        accountName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        amountCents:
          type: integer
    BillLineInput:
      type: object
      required: [amountCents]
      properties:
        accountId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        amountCents:
          type: integer
    BillPayment:
      type: object
      required: [id, date, method, amountCents]
      properties:
        id:
          type: integer
        date:
          type: string
        method:
