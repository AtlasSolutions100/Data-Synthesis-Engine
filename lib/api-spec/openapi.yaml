openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: accounts
    description: Chart of accounts
  - name: customers
    description: Customers
  - name: vendors
    description: Vendors
  - name: employees
    description: Employees
  - name: jobs
    description: Jobs
  - name: transactions
    description: Ledger transactions
  - name: reports
    description: Reporting and dashboards
  - name: invoices
    description: Customer invoices (accounts receivable)
  - name: bills
    description: Vendor bills (accounts payable)
  - name: payroll
    description: Payroll runs and labor costing
  - name: documents
    description: Per-job document management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: feedback
    description: In-app feedback items and screenshots
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List chart of accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
  /accounts/import:
    post:
      operationId: importChartOfAccounts
      tags: [accounts]
      summary: Import a QuickBooks chart of accounts export (admin only)
      description: Parses a QuickBooks chart-of-accounts Excel export and upserts accounts by number. Never deletes; pre-validates the whole workbook before any write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportChartOfAccountsInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportChartOfAccountsResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /import/{entity}:
    post:
      operationId: importData
      tags: [import]
      summary: Preview or apply an Excel data import for a given entity tab
      description: >
        Two-phase spreadsheet import shared by all tabs. In preview mode the
        workbook is parsed and each row is classified (new, duplicate that
        would update an existing record, or error) without writing anything.
        In apply mode the same workbook is re-parsed and rows are inserted or
        updated, skipping any row numbers listed in excludeRows. Never deletes.
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [customers, vendors, jobs, employees, bills, invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportDataInput"
      responses:
        "200":
          description: Preview rows or apply summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDataResult"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get an account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerListItem"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/Error"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error"
  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /vendors/{id}/default-account:
    get:
      operationId: getVendorDefaultAccount
      tags: [vendors]
      summary: Get the vendor's most-used expense account (smart default)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Suggested default account for this vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorDefaultAccount"
        "404":
          $ref: "#/components/responses/Error"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeListItem"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/Error"
  /employees/extract:
    post:
      operationId: extractEmployees
      tags: [employees]
      summary: Extract employee records from free-form text or an uploaded document
      description: Uses an AI model to parse pasted text (emails, rate sheets) or an uploaded image/PDF into structured employee rows (name, rates, status) for review before saving to the Employee Center.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractEmployeesInput"
      responses:
        "200":
          description: Extracted employee rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractEmployeesResult"
        "400":
          $ref: "#/components/responses/Error"
  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      description: Returns the employee with the SSN masked (last four digits only) by default. Pass reveal=true to receive the full SSN, e.g. when the user explicitly clicks Reveal or opens the edit form.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: reveal
          in: query
          required: false
          description: When true, include the full SSN instead of the masked value
          schema:
            type: boolean
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
  /employees/{id}/timecards:
    get:
      operationId: listEmployeeTimecards
      tags: [employees]
      summary: List an employee's time card history across payroll runs
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: year
          in: query
          required: false
          description: Restrict to runs whose pay period starts in this calendar year; omit for all years
          schema:
            type: integer
      responses:
        "200":
          description: Time card rows, newest pay period first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeTimecardRow"
        "404":
          $ref: "#/components/responses/Error"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
        - name: includeInactive
          in: query
          required: false
          description: >-
            When true, inactive jobs are included. By default the list only
            returns jobs that are not inactive (P4-CUST-04).
          schema:
            type: boolean
      responses:
        "200":
          description: List of jobs with rolled-up totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/Error"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
  /jobs/{id}/cost-summary:
    get:
      operationId: getJobCostSummary
      tags: [jobs]
      summary: Per-job cost summary
      description: Income, cost, profit and per-account breakdown for one job, computed from stored line items.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Job cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCostSummary"
        "404":
          $ref: "#/components/responses/Error"
  /jobs/{id}/documents:
    get:
      operationId: listJobDocuments
      tags: [documents]
      summary: List documents attached to a job
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: List of job documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobDocument"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: createJobDocument
      tags: [documents]
      summary: Attach an uploaded document to a job
      description: Stores metadata for a file already uploaded to object storage.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDocument"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /documents/{id}:
    delete:
      operationId: deleteJobDocument
      tags: [documents]
      summary: Delete a job document
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions
      parameters:
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
        - name: vendorId
          in: query
          required: false
          schema:
            type: integer
        - name: type
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /transactions/legacy-splits:
    get:
      operationId: listLegacySplits
      tags: [transactions]
      summary: List unresolved legacy free-text split account names
      responses:
        "200":
          description: Legacy split names grouped with their transaction ids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacySplitGroup"
  /transactions/legacy-splits/map:
    post:
      operationId: mapLegacySplit
      tags: [transactions]
      summary: Link all transactions with a legacy split name to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacySplitMapBody"
      responses:
        "200":
          description: Mapping applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySplitMapResponse"
        "400":
          $ref: "#/components/responses/Error"
  /transactions/legacy-splits/undo:
    post:
      operationId: undoLegacySplitMapping
      tags: [transactions]
      summary: Undo a previous legacy split mapping for explicit transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacySplitUndoBody"
      responses:
        "200":
          description: Undo applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySplitUndoResponse"
        "400":
          $ref: "#/components/responses/Error"

  /transactions/unlinked-bills:
    get:
      operationId: listUnlinkedBillTransactions
      tags: [transactions]
      summary: Legacy bill transactions the auto-link backfill could not link
      description: Every ledger transaction of type "bill" with no bill link, with the reason the automatic backfill skipped it (ambiguous match, amount mismatch, or no matching bill) and its candidate bills so a user can link it by hand.
      responses:
        "200":
          description: Unlinked legacy bill transactions with candidate bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnlinkedBillTransaction"
  /transactions/{id}/link-bill:
    post:
      operationId: linkTransactionBill
      tags: [transactions]
      summary: Manually link a legacy bill transaction to a bill
      description: Sets transactions.bill_id only; amounts, dates, and report totals are never touched.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualBillLinkBody"
      responses:
        "200":
          description: Transaction after linking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /reports/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [reports]
      summary: Company-wide profit and loss summary
      parameters:
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /reports/cost-by-account:
    get:
      operationId: getCostByAccount
      tags: [reports]
      summary: Totals grouped by account
      parameters:
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
          description: Only include costs on jobs belonging to this customer
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
          description: Only include costs on this job
        - name: vendorId
          in: query
          required: false
          schema:
            type: integer
          description: Only include costs on transactions linked to this vendor
      responses:
        "200":
          description: Account totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountTotal"
  /reports/pnl:
    get:
      operationId: getPnl
      tags: [reports]
      summary: Profit and loss statement grouped by account
      description: Income, COGS, expense, and other income/expense accounts with period totals, gross profit, and net income. Optional jobId or vendorId narrows the statement to that job's or vendor's activity.
      parameters:
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
        - name: jobId
          in: query
          required: false
          schema:
            type: integer
          description: Only include activity on this job
        - name: vendorId
          in: query
          required: false
          schema:
            type: integer
          description: Only include activity linked to this vendor
      responses:
        "200":
          description: Profit and loss statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PnlReport"
  /reports/account-balances:
    get:
      operationId: getAccountBalances
      tags: [reports]
      summary: Balance-sheet account balances
      description: Computed balance of each balance-sheet account (asset, bank, liability, credit_card) from linked transaction and split lines. When asOf is provided, only transactions dated on or before asOf count; omitted = all-time.
      parameters:
        - $ref: "#/components/parameters/AsOfDateParam"
      responses:
        "200":
          description: Balance-sheet account balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalances"
  /reports/account-balances/{accountId}/transactions:
    get:
