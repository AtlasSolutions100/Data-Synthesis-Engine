        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    UuidIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    StartDateParam:
      name: startDate
      in: query
      required: false
      description: Inclusive start of the date range (YYYY-MM-DD). Omit for no lower bound.
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    EndDateParam:
      name: endDate
      in: query
      required: false
      description: Inclusive end of the date range (YYYY-MM-DD). Omit for no upper bound.
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    AsOfDateParam:
      name: asOf
      in: query
      required: false
      description: Report balances as of this date, inclusive (YYYY-MM-DD). When omitted, all transactions count regardless of date; aging buckets are computed relative to today.
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        field:
          type: string
          description: >-
            Machine-readable path of the form field the error relates to,
            e.g. "vendorId", "jobId", or "lines.1.accountId".

    FeedbackTargetType:
      type: string
      enum: [page, job, bill, invoice, transaction, report, other]
    FeedbackStatus:
      type: string
      enum: [incomplete, in_review, complete]
    FeedbackItem:
      type: object
      required: [id, targetType, body, status, starred, createdAt, updatedAt, hasScreenshot]
      properties:
        id:
          type: string
        targetType:
          $ref: "#/components/schemas/FeedbackTargetType"
        targetId:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
          description: Human-readable trail of where the feedback was sent from, e.g. "Jobs > Larkspur Gear"
        body:
          type: string
        status:
          $ref: "#/components/schemas/FeedbackStatus"
        starred:
          type: boolean
        submittedBy:
          type: ["integer", "null"]
