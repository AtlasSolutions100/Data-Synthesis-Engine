          type: array
          items:
            type: string
          description: Account names skipped because they have no account number (QB system accounts)
    ImportDataInput:
      type: object
      required: [fileData, mode]
      properties:
        fileData:
          type: string
          maxLength: 14000000
          description: Base64 data URL of the uploaded .xlsx workbook
        fileName:
          type: string
          maxLength: 300
        mode:
          type: string
          enum: [preview, apply]
        excludeRows:
          type: array
          maxItems: 20000
          items:
            type: integer
          description: Row numbers (from the preview) to skip when applying
        planToken:
          type: string
          maxLength: 128
          description: >
            Consistency token returned by the preview. Required in apply mode;
            the apply is rejected with 409 if the re-computed plan no longer
            matches (data changed between preview and apply).
        accountOverrides:
          type: array
          maxItems: 20000
          items:
            $ref: "#/components/schemas/ImportAccountOverride"
          description: >
            Per-line account overrides chosen during the bill-import review.
            Each entry targets a preview row and line index and replaces (or
            clears, when accountId is null) the account the plan chose.
    ImportAccountOverride:
      type: object
      required: [row, line, accountId]
      properties:
        row:
          type: integer
          description: Row number of the preview row (same id used by excludeRows)
        line:
          type: integer
          description: Zero-based line index within that row's lines
        accountId:
          type: ["integer", "null"]
          description: Account to post the line to, or null to clear the account
    ImportRowChange:
      type: object
      required: [field, from, to]
      properties:
        field:
          type: string
        from:
          type: ["string", "null"]
        to:
          type: ["string", "null"]
    ImportPreviewRow:
      type: object
      required: [row, status, label, message, changes]
      properties:
        row:
          type: integer
          description: Stable row identifier used in excludeRows
        status:
          type: string
          enum: [new, duplicate, error]
        label:
          type: string
          description: Human-readable identity of the row (name, bill number, etc.)
        message:
          type: ["string", "null"]
          description: Explanation for errors or duplicate matches
        changes:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ImportRowChange"
          description: For duplicates, the fields that would change on update
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewLine"
          description: >
            For bill imports, the individual lines of this document with the
            account each will post to, so the user can review and override
            auto-filled accounts before applying.
    ImportPreviewLine:
      type: object
      required: [line, description, amountCents, accountId, accountName, autoFilled]
      properties:
        line:
