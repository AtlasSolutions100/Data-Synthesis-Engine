      type: object
      required: [name]
      properties:
        jobNumber:
          type: string
          minLength: 1
          description: Optional internal identifier; auto-generated when omitted
        name:
          type: string
          minLength: 1
        poNumber:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        isInternal:
          type: boolean
          description: >-
            Explicit override to save an internal (non-billable) job without a
            customer. When true, customerId is ignored and stored as null.
            Without it, a missing customerId is rejected.
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, on_hold, inactive]
        contractAmountCents:
          type: integer
