    JobDocument:
      type: object
      required: [id, jobId, category, fileName, objectPath, downloadToken, createdAt]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        category:
          type: string
          enum: [contract, certified_payroll, timesheet, invoice_backup, permit_insurance, other]
        fileName:
          type: string
        objectPath:
          type: string
        downloadToken:
          type: string
          description: >-
            Short-lived signed token that must be supplied as the `token` query
            param when fetching the document via GET /storage/objects/*. Expires
            after a fixed TTL so a copied link stops working.
        contentType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        uploadedByUserId:
          type: integer
          nullable: true
        uploadedByName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    JobDocumentInput:
      type: object
      required: [category, fileName, objectPath]
      properties:
        category:
          type: string
          enum: [contract, certified_payroll, timesheet, invoice_backup, permit_insurance, other]
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
        contentType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
